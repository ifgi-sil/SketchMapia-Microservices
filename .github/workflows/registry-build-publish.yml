name: Build and Push Docker Images

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history + tags, needed for git describe

      - name: Set lowercase owner and version info
        id: vars
        run: |
          echo "owner_lc=${GITHUB_REPOSITORY_OWNER,,}" >> $GITHUB_ENV
          echo "git_tag=$(git describe --tags --abbrev=0 2>/dev/null || echo '')" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push validation
        uses: docker/build-push-action@v5
        with:
          context: ./validation
          file: ./validation/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ env.owner_lc }}/validation:latest

      - name: Build and Push generalizations
        uses: docker/build-push-action@v5
        with:
          context: ./generalizations
          file: ./generalizations/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ env.owner_lc }}/generalizations:latest

      - name: Build and Push completeness
        uses: docker/build-push-action@v5
        with:
          context: ./completeness
          file: ./completeness/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ env.owner_lc }}/completeness:latest

      - name: Build and Push qualitativerelations
        uses: docker/build-push-action@v5
        with:
          context: ./accuracy
          file: ./accuracy/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ env.owner_lc }}/qualitativerelations:latest

      - name: Build and Push gmda
        uses: docker/build-push-action@v5
        with:
          context: ./gmda
          file: ./gmda/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ env.owner_lc }}/gmda:latest

      - name: Build and Push bdr
        uses: docker/build-push-action@v5
        with:
          context: ./bdr
          file: ./bdr/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ env.owner_lc }}/bdr:latest

      - name: Build and Push sketchmap_analyser
        uses: docker/build-push-action@v5
        with:
          context: ./sketchmap_analyser
          file: ./sketchmap_analyser/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ env.owner_lc }}/sketchmap_analyser:latest
          build-args: |
            GIT_TAG=${{ env.git_tag }}
            GIT_SHA=${{ github.sha }}
            GIT_COMMIT_DATE=${{ github.event.head_commit.timestamp }}
