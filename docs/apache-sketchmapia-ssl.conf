# Apache reverse-proxy vhost — reference copy.
#
# Live file on the server: /etc/apache2/sites-available/sketchmapia-ssl.conf
# Edit here first, copy to the server, then:
#   sudo apachectl configtest && sudo systemctl reload apache2
#
# All production traffic enters through this vhost on 443; the per-service
# ports (8000-8006) are only bound on localhost for Apache and must NOT be
# opened to the outside. Service-specific ProxyPass rules must come BEFORE
# the catch-all "ProxyPass /" (first match wins).

<VirtualHost *:443>
    ServerName sketchmapia.uni-muenster.de

    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/sketchmapia/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/sketchmapia/privkey.pem

    ProxyPreserveHost On

    # Generalizations service
    ProxyPassMatch ^/generalizations/(.*)$ http://localhost:8001/generalizations/$1
    ProxyPassReverse /generalizations/ http://localhost:8001/generalizations/

    # Completeness service
    ProxyPassMatch ^/completeness/(.*)$ http://localhost:8002/completeness/$1
    ProxyPassReverse /completeness/ http://localhost:8002/completeness

    # Accuracy service
    ProxyPassMatch ^/accuracy/(.*)$ http://localhost:8003/accuracy/$1
    ProxyPassReverse /accuracy/ http://localhost:8003/accuracy

    # Validation service
    ProxyPassMatch ^/validation/(.*)$ http://localhost:8004/validation/$1
    ProxyPassReverse /validation/ http://localhost:8004/validation

    # GMDA service
    ProxyPassMatch ^/gmda/(.*)$ http://localhost:8005/gmda/$1
    ProxyPassReverse /gmda/ http://localhost:8005/gmda/

    # BDR service
    ProxyPassMatch ^/bdr/(.*)$ http://localhost:8006/bdr/$1
    ProxyPassReverse /bdr/ http://localhost:8006/bdr/

    # Sketchmap analyser (main app) — keep last: catch-all
    ProxyPass        / http://localhost:8000/
    ProxyPassReverse / http://localhost:8000/

    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-Port "443"

    Header always set Strict-Transport-Security "max-age=63072000; includeSubDomains; preload"
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set X-XSS-Protection "1; mode=block"

    SSLProtocol all -SSLv2 -SSLv3 -TLSv1 -TLSv1.1

    SSLHonorCipherOrder on
    SSLCipherSuite "ECDHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256"

    SSLUseStapling on
    SSLOCSPProxyURL http://wwwproxy.uni-muenster.de:3128/

    ErrorLog ${APACHE_LOG_DIR}/sketchmapia_error.log
    CustomLog ${APACHE_LOG_DIR}/sketchmapia_access.log combined
</VirtualHost>
